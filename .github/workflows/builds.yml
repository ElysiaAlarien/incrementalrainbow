name: Builds

# Exports the builds that need no signing, and starts the desktop builds.
# See docs/building.md for why it runs on each change.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - docs/**
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**/*.md"

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  export:
    name: Export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_DIR: ${{ github.workspace }}/../godot
      TEMPLATES_DIR: ${{ github.workspace }}/../templates
    steps:
      - uses: actions/checkout@v7

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          curl -fsSL -o "${name}.zip" "${base}/${name}.zip"
          curl -fsSL -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          grep " ${name}.zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "${name}.zip"
          mv "$name" godot
          rm "${name}.zip" SHA512-SUMS.txt

      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@v6
        with:
          path: ${{ env.TEMPLATES_DIR }}
          key: godot-templates-${{ env.GODOT_VERSION }}-linux-windows-macos-ios-android

      # The templates file has all platforms (1.3 GB). Keep only the
      # templates that the presets use.
      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          name="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p "$TEMPLATES_DIR" && cd "$TEMPLATES_DIR"
          curl -fsSL -o "$name" "${base}/${name}"
          curl -fsSL -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          grep " ${name}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q -j "$name" templates/version.txt templates/icudt_godot.dat \
            'templates/linux_*.x86_64' 'templates/windows_*_x86_64*' templates/macos.zip \
            templates/ios.zip templates/android_debug.apk templates/android_release.apk
          rm "$name" SHA512-SUMS.txt

      - name: Install export templates
        run: |
          set -euo pipefail
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp "$TEMPLATES_DIR"/* "$dest"/

      - name: Export Linux, Windows, and macOS
        run: GODOT="$GODOT_DIR/godot" tools/build.sh Linux Windows macOS

      # A debug build is signed with a debug key that Godot makes. A release
      # build needs the release key (see docs/building.md).
      - name: Export Android (debug)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: GODOT="$GODOT_DIR/godot" tools/build.sh --debug Android

      - name: Check the Android permissions
        run: |
          set -euo pipefail
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)"
          "$aapt2" dump permissions build/android/IncrementalRainbow.apk | tee build/android-permissions.txt
          if grep -E -i 'BILLING|AD_ID|ADSERVICES' build/android-permissions.txt; then
            echo "The APK has a permission for ads or in-app purchases." >&2
            exit 1
          fi

      # An iOS export needs an Apple team id, and only macOS can build the
      # .ipa. So CI exports only the Xcode project, with a placeholder team
      # id in this copy of the presets. The tracked file does not change.
      - name: Export the iOS Xcode project
        run: |
          set -euo pipefail
          sed -i \
            -e 's|^application/app_store_team_id=""|application/app_store_team_id="ABCDE12345"|' \
            -e 's|^application/export_project_only=false|application/export_project_only=true|' \
            -e 's|build/ios/IncrementalRainbow.ipa|build/ios/IncrementalRainbow.xcodeproj|' \
            export_presets.cfg
          # Stop if a pattern did not match, for example after a preset change.
          grep -q '^application/app_store_team_id="ABCDE12345"' export_presets.cfg
          grep -q '^application/export_project_only=true' export_presets.cfg
          grep -q 'build/ios/IncrementalRainbow.xcodeproj' export_presets.cfg
          GODOT="$GODOT_DIR/godot" tools/build.sh iOS
          git checkout -- export_presets.cfg

      - name: Start the Linux build
        run: tools/start_check.sh build/linux/IncrementalRainbow.x86_64

      - name: Upload the Linux build
        uses: actions/upload-artifact@v7
        with:
          name: build-linux
          path: build/linux/
          if-no-files-found: error

      - name: Upload the Windows build
        uses: actions/upload-artifact@v7
        with:
          name: build-windows
          path: build/windows/
          if-no-files-found: error

      - name: Upload the macOS build
        uses: actions/upload-artifact@v7
        with:
          name: build-macos
          path: build/macos/
          if-no-files-found: error

      - name: Upload the Android build
        uses: actions/upload-artifact@v7
        with:
          name: build-android-debug
          path: build/android/
          if-no-files-found: error

      - name: Upload the iOS Xcode project
        uses: actions/upload-artifact@v7
        with:
          name: build-ios-xcode-project
          path: build/ios/
          if-no-files-found: error

      - name: Upload the export logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: export-logs
          path: build/*.log
          if-no-files-found: ignore

  start-windows:
    name: Start on Windows
    needs: export
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-windows
          path: build/windows

      - name: Start the Windows build
        shell: bash
        run: tools/start_check.sh build/windows/IncrementalRainbow.exe

  start-macos:
    name: Start on macOS
    needs: export
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-macos
          path: build/macos

      - name: Start the macOS build
        run: |
          set -euo pipefail
          cd build/macos
          unzip -q IncrementalRainbow.zip
          cd ../..
          tools/start_check.sh "build/macos/Incremental Rainbow.app/Contents/MacOS/Incremental Rainbow"
